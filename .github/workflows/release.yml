name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build twine
      - run: ruff check context_render tests
      - run: pytest -q
      # the tag is the release trigger; refuse to publish if it disagrees with __version__
      - name: Check tag matches package version
        run: |
          version=$(python -c "import context_render; print(context_render.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package version v$version" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: no token stored; PyPI trusts this repo + workflow + environment
    environment:
      name: pypi
      url: https://pypi.org/p/context-render
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
