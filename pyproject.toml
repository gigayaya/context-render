[project]
name = "context-render"
version = "0.2.0"
description = "Context window observability for Claude Code: see which of your scaffolding components an agent actually used"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ctxr = "context_render.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_render*"]

[tool.setuptools.package-data]
"context_render.store" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F",       # ruff defaults
    "I",            # import order
    "UP",           # py311 idioms
    "B",            # bugbear (typer.Option defaults exempted below)
    "BLE",          # blind except: the deliberate ones carry `# noqa: BLE001` with a reason
    "SIM", "C4", "PIE", "RET", "PERF", "RUF",
    "PLE", "PLW",   # pylint errors/warnings; PLR/PLC left out (complexity and magic-value churn)
]
ignore = [
    # over-long lines are mostly literal help/report text; the width is still the format target
    "E501",
    # arrows, dashes, × and CJK punctuation are intentional report vocabulary, not typos
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options via calls in argument defaults; ruff-documented exemption
extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
