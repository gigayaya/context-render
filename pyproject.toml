[project]
name = "context-render"
dynamic = ["version"]
description = "Context window observability for Claude Code: see which of your scaffolding components an agent actually used"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giga Chang" }]
keywords = ["claude-code", "claude", "observability", "llm", "agents", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ctxr = "context_render.cli:main"

[project.urls]
Homepage = "https://github.com/gigayaya/context-render"
Documentation = "https://github.com/gigayaya/context-render/tree/main/docs"
Issues = "https://github.com/gigayaya/context-render/issues"
Changelog = "https://github.com/gigayaya/context-render/commits/main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "context_render.__version__" }

[tool.setuptools.packages.find]
include = ["context_render*"]

[tool.setuptools.package-data]
"context_render.store" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F",       # ruff defaults
    "I",            # import order
    "UP",           # py311 idioms
    "B",            # bugbear (typer.Option defaults exempted below)
    "BLE",          # blind except: the deliberate ones carry `# noqa: BLE001` with a reason
    "SIM", "C4", "PIE", "RET", "PERF", "RUF",
    "PLE", "PLW",   # pylint errors/warnings; PLR/PLC left out (complexity and magic-value churn)
]
ignore = [
    # over-long lines are mostly literal help/report text; the width is still the format target
    "E501",
    # arrows, dashes, × and CJK punctuation are intentional report vocabulary, not typos
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options via calls in argument defaults; ruff-documented exemption
extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
